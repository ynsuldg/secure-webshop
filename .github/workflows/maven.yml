name: Maven Build

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checka ut koden
        uses: actions/checkout@v4

      - name: Checka ut mailbiblioteket
        uses: actions/checkout@v4
        with:
          repository: ynsuldg/secure-webshop-message-service
          path: secure-webshop-message-service

      - name: Installera Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Installera mailbiblioteket
        run: mvn -B install -DskipTests -f secure-webshop-message-service/pom.xml

      - name: Bygg projektet
        run: mvn -B clean package

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ynsuldg/secure-webshop:1.2.1
